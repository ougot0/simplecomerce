# Projet de l'application iPhone de Simple Commerce.
# Le projet Xcode est fabriqué à partir de ce fichier par XcodeGen (« xcodegen generate »),
# automatiquement lors de la construction sur GitHub : il n'y a rien à installer chez soi.
name: SimpleCommerce
options:
  bundleIdPrefix: com.simplecommercess
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: fr
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  SimpleCommerce:
    type: application
    platform: iOS
    sources:
      - path: SimpleCommerce
        excludes:
          - Info.plist
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplecommercess.app
        PRODUCT_NAME: SimpleCommerce
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
    info:
      path: SimpleCommerce/Info.plist
      properties:
        CFBundleDisplayName: Simple Commerce
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Light
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UILaunchScreen:
          UIColorName: Fond
          UIImageName: Logo
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "Pour prendre en photo vos produits et les ajouter directement à votre site."
        NSPhotoLibraryUsageDescription: "Pour choisir des photos de vos produits dans votre photothèque."
